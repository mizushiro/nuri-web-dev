<!-- 메인메뉴 : 모바일 전체메뉴 드로어 -->

	<div class="nr__mobile-nav-backdrop"></div>
	<div class="nr__mobile-nav-wrap">
		<!-- 모바일 헤더 -->
		<div class="nr__mobile-nav-header">
			<!-- 유틸 버튼 -->
			<div class="nr__mobile-util">
				<ul class="nr__mobile-util-list">
					<li><button type="button" class="nr__btn nr__btn-xsmall nr__btn-text" aria-label="메인페이지"><i class="icon-aspect-home" data-size="20"></i></button></li>
					<li><button type="button" class="nr__btn nr__btn-xsmall nr__btn-text">English</button></li>
					<li><button type="button" class="nr__btn nr__btn-xsmall nr__btn-text">中文</button></li>
					<li><button type="button" class="nr__btn nr__btn-xsmall nr__btn-text">日本語</button></li>
				</ul>
			</div>
			<!-- //유틸 버튼 -->
		</div>
		<!-- //모바일 헤더 -->

		<!-- 모바일 본문 네비게이션 트리 -->
		<div class="nr__mobile-nav-body">
			<!-- 1Depth 탭 목록 -->
			<div class="nr__mobile-menu-container">
				<div class="nr__mobile-tabs">
					<ul>
						<!-- aside-menu.json 기반 1Depth 탭 동적 렌더링 영역 -->
					</ul>
				</div>
				<!-- 2Depth~4Depth 서브메뉴 -->
				<div class="nr__mobile-sub-wrap">
					<!-- aside-menu.json 기반 2Depth~3Depth 서브메뉴 동적 렌더링 영역 -->
				</div>
			</div>
			<!-- //1Depth 탭 목록 -->
		</div>
		<!-- //모바일 본문 -->

		<!-- 닫기 버튼 -->
		<button type="button" class="nr__btn nr__btn-medium nr__btn-icon nr__mobile-close-btn" id="close-nav"
			aria-label="전체메뉴 닫기">
			<span class="nr__sr-only">전체메뉴 닫기</span>
			<i class="svg-icon ico-popup-close"></i>
		</button>
		<!-- //닫기 버튼 -->
	</div>
</div>
